name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Linters
        run: |
          make lint

      - name: Run Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/airflow
        run: |
          AIRFLOW__CORE__LOAD_EXAMPLES=false airflow db migrate
          pytest tests/
