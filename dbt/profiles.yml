elt_lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: /tmp/dbt.duckdb
      extensions:
        - httpfs
        - aws
        - postgres
      settings:
        s3_endpoint: minio:9000
        s3_access_key_id: "{{ env_var('MINIO_ACCESS_KEY', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('MINIO_SECRET_KEY', 'minioadmin') }}"
        s3_use_ssl: false
        s3_region: us-east-1
        s3_url_style: path
      attach:
        - alias: pg
          type: postgres
          path: "dbname={{ env_var('POSTGRES_DB', 'elt_lakehouse') }} user={{ env_var('POSTGRES_USER', 'elt_user') }} password={{ env_var('POSTGRES_PASSWORD', 'elt_password') }} host={{ env_var('POSTGRES_HOST', 'postgres') }} port={{ env_var('POSTGRES_PORT', '5432') }}"
