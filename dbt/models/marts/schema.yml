version: 2

models:
  - name: dim_users
    description: "Dimension table for users."
    columns:
      - name: user_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: user_login

  - name: dim_labels
    description: "Dimension table for issue labels."
    columns:
      - name: label_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: label_name

  - name: fct_pull_requests
    description: "Fact table for pull requests."
    columns:
      - name: pr_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: "ref('dim_users')"
              field: user_id
      - name: duration_hours
        description: "Duration from creation to merge in hours"

  - name: fct_issues
    description: "Fact table for issues."
    columns:
      - name: issue_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: "ref('dim_users')"
              field: user_id
      - name: duration_hours
        description: "Duration from creation to close in hours"

# Example of a dbt unit test for duration logic
unit_tests:
  - name: test_fct_pull_requests_duration
    description: "Check duration calculation in fct_pull_requests"
    model: fct_pull_requests
    given:
      - input: ref('stg_pull_requests')
        rows:
          - {
              pr_id: 1,
              created_at: "2023-01-01 10:00:00",
              merged_at: "2023-01-01 12:00:00",
            }
          - { pr_id: 2, created_at: "2023-01-01 10:00:00", merged_at: null }
    expect:
      rows:
        - { pr_id: 1, duration_hours: 2.0 }
        - { pr_id: 2, duration_hours: null }
