
x-airflow-common:
  &airflow-common
  image: apache/airflow:2.10.5-python3.11
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-elt_user}:${POSTGRES_PASSWORD:-elt_password}@postgres:5432/${POSTGRES_DB:-elt_lakehouse}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'super_secret_key_for_airflow_webserver_123!'
    AIRFLOW__WEBSERVER__SESSION_BACKEND: 'securecookie'
    _PIP_ADDITIONAL_REQUIREMENTS: 'dbt-postgres==1.9.0 dbt-duckdb==1.9.0 dbt-core==1.9.1 dlt[duckdb,s3]==1.30.0 duckdb'
    # Environment variables for our pipeline
    GITHUB_API_TOKEN: ${GITHUB_API_TOKEN}
    DEMO_MODE: ${DEMO_MODE:-false}
    POSTGRES_USER: ${POSTGRES_USER:-elt_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elt_password}
    POSTGRES_DB: ${POSTGRES_DB:-elt_lakehouse}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    AWS_ENDPOINT_URL: http://minio:9000
    AWS_REGION: us-east-1
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    - ./data/seed:/opt/airflow/data/seed
    - ./dbt:/opt/airflow/dbt
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15.8-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elt_password}
      POSTGRES_DB: ${POSTGRES_DB:-elt_lakehouse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  metabase:
    image: metabase/metabase:v0.51.5
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${POSTGRES_DB:-elt_lakehouse}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-elt_user}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-elt_password}
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
